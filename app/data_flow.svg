<rect x="490" y="225" width="220" height="85"/><text x="600" y="260">開啟配息試算</text><text x="600" y="289">額外取得除息事件</text>
<path d="M600 310V345"/><rect x="420" y="345" width="290" height="85"/><text x="565" y="380">Close ＋ 配息（不再投入）</text><text x="565" y="408">含息損益・期間配息率</text>
<rect x="10" y="460" width="700" height="75"/><text x="360" y="492">還原價格價值 ≠ 現金配息帳戶</text><text x="360" y="519">兩條計算路徑獨立，避免配息重複計入</text></svg>